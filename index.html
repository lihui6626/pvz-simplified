<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物大战僵尸 · 简化版</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Comic Sans MS","幼圆","YouYuan","PingFang SC","Microsoft YaHei",sans-serif;
    background:

  #overlay button:hover{transform:translateY(-2px);}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <!-- 菜单 -->
  <div id="menu" class="screen">

      🪴 玩法：点击卡片选植物 → 点击绿色草地格子种植。<br>
      ☀️ 点击阳光收集，向日葵也会产阳光。<br>
      🚜 僵尸走到左侧会触发小车清行；小车用光后僵尸进屋就输了。<br>
      🔢 快捷键 1~9、0、-、= 快速选卡，右键取消。

  </div>

        <div id="cards"></div>

</div>

const COLS=9, ROWS=5, CELL=100, BT=60, BL=80;   // 棋盘 9x5

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){   // 圆角矩形路径
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawPlantImage(p){
  const img=PLANT_IMAGES[p.type];

  const s=72;
  ctx.drawImage(img,-s/2,-s/2,s,s);
  return true;
}

// ==================== 工具函数 ====================
const cellX=c=>BL+c*CELL, cellY=r=>BT+r*CELL;
const cx=(r,c)=>BL+c*CELL+CELL/2, cy=(r,c)=>BT+r*CELL+CELL/2;
function plantAt(r,c){ for(const p of plants) if(p.row===r&&p.col===c&&!p.dead) return p; return null; }
function colAt(x){ return Math.floor((x-BL)/CELL); }
function rowAt(y){ return Math.floor((y-BT)/CELL); }
function cellFromXY(x,y){
  if(x<BL||x>=BL+COLS*CELL||y<BT||y>=BT+ROWS*CELL) return null;
  return {row:rowAt(y), col:colAt(x)};
}
function buildWaves(L){
  const list=[];
  L.waves.forEach(w=>{ w.groups.forEach(g=>{
    for(let i=0;i<g.n;i++) list.push({t:w.at+i*g.every, type:g.type});
  });});
  list.sort((a,b)=>a.t-b.t);
  if(list.length){
    const lw=L.waves[L.waves.length-1];
    const lg=lw.groups[lw.groups.length-1];
    list.push({t:list[list.length-1].t+3, type:lg.type, boss:true}); // 每关最后的 Boss，类型与最后一波最强僵尸一致
  }
  return list;
}
// 无尽模式：按波次动态生成僵尸（round 从 1 开始，start 为本波起始时间）
function buildEndlessWaves(round, start){
  const n=Math.max(0,round);           // 波次越高，数量越多、间隔越短
  const at1=start+8, at2=start+30, at3=start+55;
  const w=[
    {at:at1, groups:[{type:'normal', n:3+round,        every:Math.max(1.2, 3-round*0.15)}]},
    {at:at2, groups:[{type:'cone',   n:2+Math.ceil(round*0.8), every:Math.max(1.4, 3-round*0.1)},
                     {type:'bucket', n:round>=2?1+Math.floor(round/2):0, every:Math.max(2, 4-round*0.1)}]},
    {at:at3, groups:[{type:'football', n:1+Math.floor(round/2), every:Math.max(1.8, 3.5-round*0.1)}]},
  ];
  // 巨人僵尸：第 3 波开始出现在收尾波，第 6 波开始中期也出现
  if(round>=3) w[2].groups.push({type:'giant', n:1+Math.floor(round/3), every:9});
  if(round>=6) w[1].groups.push({type:'giant', n:1, every:10});
  const list=[];
  w.forEach(x=>x.groups.forEach(g=>{
    for(let i=0;i<g.n;i++) list.push({t:x.at+i*g.every, type:g.type});
  }));
  list.sort((a,b)=>a.t-b.t);
  // 每波压轴：一只巨人（第 5 波起为 3 倍血 BOSS 巨人）
  list.push({t:list[list.length-1].t+3, type:'giant', boss:round>=5});
  return {list, ats:[at1,at2,at3]};
}

// ==================== 生成与实体 ====================
function bestRow(){
  const counts=Array(ROWS).fill(0);
  for(const z of zombies) if(!z.dead) counts[z.row]++;
  let min=99, rows=[];
  for(let r=0;r<ROWS;r++){ if(counts[r]<4){ if(counts[r]<min){min=counts[r]; rows=[r];} else if(counts[r]===min) rows.push(r); } }
  if(!rows.length) rows=[0,1,2,3,4];
  return rows[Math.floor(Math.random()*rows.length)];
}
function spawnZombie(type, boss){
  const Z=ZOMBIES[type];
  const row=bestRow();
  const hpMul=boss?3:1; // 僵尸血量已降低：普通僵尸原版血量，BOSS 3 倍
  zombies.push({type,row, x:W+30, hp:Z.hp*hpMul, maxHp:Z.hp*hpMul, speed:Z.speed, dmg:Z.dmg,
    biteCd:Z.biteCd, biteT:0, slow:0, wob:rnd(0,6.28), dead:false, boss:!!boss});
  if(boss) daveSay('👑 '+Z.name+' BOSS 出现！血量 3 倍！');
}
function placePlayerZombie(type,row,col){
  // 玩家从僵尸卡槽放出的僵尸（带 player 标记，不走失败/胜利判定）
  const Z=ZOMBIES[type];
  const x=cx(row,col)+30;
  zombies.push({type,row,x,hp:Z.hp,maxHp:Z.hp,speed:Z.speed,dmg:Z.dmg,
    biteCd:Z.biteCd,biteT:0,slow:0,wob:rnd(0,6.28),dead:false,player:true});
  effects.push({type:'poof',x,y:cy(row,0)-50+50,t:0.3});
  daveSay('放出了 1 只 '+Z.name+'！');
}
function addPlant(type,row,col){
  const P=PLANTS[type];
  const p={type,row,col, hp:P.hp, maxHp:P.hp, dead:false, t:0, armT:0, armed:false,
    cx(){ return cx(this.row,this.col); },
    cy(){ return cy(this.row,this.col); }};
  if(type==='potatomine') p.armT=14;
  if(type==='magictater') p.armT=14;
  if(type==='sunflower') p.t=rnd(3,6);
  if(type==='cactus') p.t=3;
  if(type==='peashooter'||type==='snowpea') p.t=1.2;
  if(type==='repeater'||type==='cherrymachinegun'||type==='doommachinegun'||type==='firemachinegun'||type==='icemachinegun'||type==='charmmachinegun'||type==='ultcannon'||type==='peacannon'){ p.t=0.05; p.burst=0; p.ultiT=30; p.ulti=0; }
  if(type==='threepeater') p.t=1.2;
  if(type==='melonpult') p.t=2.5;
  if(type==='cherrybomb') p.t=1.3;
  if(type==='hypnotoad') p.t=0.35;
  if(type==='spikeweed') p.t=0.55;
  if(type==='jalapeno') p.t=1.2;
  if(type==='iceshroom') p.t=0.8;
  if(type==='doomshroom') p.t=1.2;
  if(type==='obsidianjalapeno') p.t=1.5;
  plants.push(p);
}

function killZombie(z){

}

function makeFallingSun(){ suns.push({x:rnd(BL+30,W-70), y:-30, ty:rnd(BT+10,BT+ROWS*CELL-20), val:2500, t:10, fall:true}); }

// ==================== 更新逻辑 ====================
function update(dt){
  if(screen!=='play'||paused) return;
  time+=dt;
  // 刷僵尸
  while(spawnQueue.length && time>=spawnQueue[0].t){ const it=spawnQueue.shift(); spawnZombie(it.type, it.boss); }
  // 波次横幅
  if(bannerTimes.length && time>=bannerTimes[0]){ bannerTimes.shift(); banner={t:2.5}; sndWave(); }
  if(banner) banner.t-=dt;
  // 戴夫唠叨
  dave.t-=dt;
  if(dave.t<=0) dave.say='';
  dave.next-=dt;
  if(dave.next<=0){ daveSay(DAVE_TIPS[Math.floor(Math.random()*DAVE_TIPS.length)]); dave.next=rnd(18,30); }
  // 阳光掉落
  sunFallTimer-=dt;
  if(sunFallTimer<=0) sunFallTimer=rnd(8.5,11); // 自然阳光生成已禁用
  updateSuns(dt);
  updatePlants(dt);
  updateProjectiles(dt);
  updateZombies(dt);
  updateMowers(dt);
  updateEffects(dt);
  // 能量豆 & 金克拉
  plantFoodTimer-=dt;
  // 能量豆已禁用：不再生成
  if(plantFoodTimer<=0) plantFoodTimer=30;
  for(const pf of plantFoodDrops) pf.t+=dt;
  plantFoodDrops=plantFoodDrops.filter(pf=>pf.t<5);   // 5秒无人拖拽就消失
  goldTimer-=dt;
  if(goldTimer<=0){ spawnGold(); goldTimer=45; }
  for(const gd of goldDrops) gd.t+=dt;
  goldDrops=goldDrops.filter(gd=>gd.t<8);
  // 冷却
  for(const t in pcd) pcd[t]=Math.max(0,pcd[t]-dt);
  // 胜负判定
  if(screen==='play' && spawnQueue.length===0 && zombies.every(z=>z.dead||z.player)){
    if(LEVELS[level]&&LEVELS[level].endless) nextEndlessRound(); else winLevel();
  }
  updateHUD();
}
function updateSuns(dt){
  for(const s of suns){
    s.t-=dt;
    if(s.y<s.ty) s.y=Math.min(s.ty, s.y+75*dt);
  }
  suns=suns.filter(s=>s.t>-1);
}
function updatePlants(dt){
  for(const p of plants){
    if(p.dead) continue;
    p.t-=dt;
    if(p.powered>0) p.powered=Math.max(0,p.powered-dt);
    switch(p.type){
      case 'sunflower':
        if(p.t<=0){ suns.push({x:p.cx()+rnd(-18,18), y:p.cy()+rnd(-16,4), ty:p.cy()+34, val:2500, t:9, fall:false}); p.t=rnd(6.5,9.5); }
        break;
      case 'peashooter':
        if(p.t<=0){ firePea(p, p.row); p.t=p.powered>0?0.3:1.5; }
        break;
      case 'snowpea':
        if(p.t<=0){ firePea(p, p.row, 'snow'); p.t=p.powered>0?0.3:1.5; }
        break;
      case 'repeater':
        p.ultiT=(p.ultiT||0)-dt;
        if(p.ultiT<=0&&!p.ulti){ p.ulti=1000; p.ultiT=30; effects.push({type:'powerup',x:p.cx(),y:p.cy(),t:1.2}); }
        if(p.ulti>0){
          firePea(p, p.row); p.ulti--;
          p.t=0.012;
          if(p.ulti===0) p.burst=0;
        } else if(p.t<=0){
          firePea(p, p.row); p.burst=(p.burst||0)+1;
          p.t=p.burst>=10?(p.burst=0,0.8):0.05;
        }
        break;
      case 'threepeater':
        if(p.t<=0){
          for(let r=Math.max(0,p.row-1);r<=Math.min(ROWS-1,p.row+1);r++) firePea(p,r,(r-p.row)*10);
          p.t=p.powered>0?0.3:1.5;
        }
        break;
      case 'melonpult':
        if(p.t<=0){
          const z=zombies.filter(z=>!z.dead&&z.row===p.row&&z.x>p.cx()-10).sort((a,b)=>a.x-b.x)[0];
          if(z) lobMelon(p, z);
          p.t=p.powered>0?0.52:2.6;
        }
        break;
      case 'cherrybomb':
        if(p.t<=0){ explodeAt(p.row,p.col,p.powered>0?9000:1800); effects.push({type:'boom',x:p.cx(),y:p.cy(),t:0.6}); p.dead=true; sndExplode(); }
        break;
      case 'potatomine':
        if(p.armT>0){ p.armT-=dt; if(p.armT<=0) p.armed=true; }
        if(p.armed){
          const near=zombies.some(z=>!z.dead&&Math.abs(z.row-p.row)<=1&&Math.abs(colAt(z.x)-p.col)<=1&&z.x>BL-20);
          if(near){ explodeAt(p.row,p.col,p.powered>0?4500:900); effects.push({type:'boom',x:p.cx(),y:p.cy(),t:0.55}); p.dead=true; sndExplode(); }
        }
        break;
      case 'magictater': // 魔术洋芋：埋地后魅惑踩到它的僵尸
        if(p.armT>0){ p.armT-=dt; if(p.armT<=0) p.armed=true; }
        if(p.armed){
          let best=null,bd=1e9;
          for(const z of zombies){
            if(z.dead||z.charmed) continue;
            if(z.row!==p.row) continue;
            if(Math.abs(colAt(z.x)-p.col)>1) continue;
            const d=Math.abs(z.x-p.cx());
            if(d<bd){bd=d;best=z;}
          }
          if(best){
            best.charmed=true; best.dmg=Math.max(best.dmg,30);
            effects.push({type:'powerup',x:best.x,y:cy(best.row,0)-50+50,t:1});
            sndChomp();
            p.dead=true;
          }
        }
        break;
      case 'cactus': // 仙人掌：每3秒发射一枚穿透尖刺
        if(p.t<=0){ fireSpike(p,p.row); p.t=p.powered>0?0.6:3; }
        break;
      case 'spikeweed':
        if(p.t<=0){
          for(const z of zombies) if(!z.dead&&z.row===p.row&&colAt(z.x)===p.col) damageZombie(z,p.powered>0?150:30);
          p.t=p.powered>0?0.11:0.55;
        }
        break;
      case 'hypnotoad':
        if(p.t<=0){
          let best=null,bd=1e9;
          for(const z of zombies){
            if(z.dead||z.charmed) continue;
            // 魅惑范围：蘑菇周围 3x3 格（僵尸必须走进范围内才会被魅惑）
            if(Math.abs(z.row-p.row)>1) continue;
            const zc=colAt(z.x);
            if(Math.abs(zc-p.col)>1) continue;
            const d=Math.abs(z.x-p.cx());
            if(d<bd){bd=d;best=z;}
          }
          if(best){
            best.charmed=true; best.dmg=Math.max(best.dmg,30);
            effects.push({type:'powerup',x:best.x,y:cy(best.row,0)-50+50,t:1});
            sndChomp();
            p.dead=true; // 成功魅惑后消失
          } else {
            p.t=0.5; // 场上暂无僵尸，保留魅惑菇等待目标
          }
        }
        break;
      case 'cherrypea': // 樱桃豌豆：豌豆×2 伤害
        if(p.t<=0){ firePea(p,p.row,0,'pea',40); p.t=p.powered>0?0.3:1.5; }
        break;
      case 'supercherry': // 超级樱桃豌豆：发射樱桃炸弹弹
        if(p.t<=0){
          const z=zombies.filter(z=>!z.dead&&z.row===p.row&&z.x>p.cx()-10).sort((a,b)=>a.x-b.x)[0];
          if(z) fireCherry(p,p.row,180,1);
          p.t=p.powered>0?0.5:2;
        }
        break;
      case 'doublepea': // 双发豌豆
        if(p.t<=0){ firePea(p,p.row,-6,'pea',20); firePea(p,p.row,6,'pea',20); p.t=p.powered>0?0.3:1.5; }
        break;
      case 'triplepea': // 三发豌豆
        if(p.t<=0){ firePea(p,p.row,-13,'pea',20); firePea(p,p.row,0,'pea',20); firePea(p,p.row,13,'pea',20); p.t=p.powered>0?0.3:1.5; }
        break;
      case 'doublecherry': // 双发樱桃：两发樱桃弹
        if(p.t<=0){
          const z=zombies.filter(z=>!z.dead&&z.row===p.row&&z.x>p.cx()-10).sort((a,b)=>a.x-b.x)[0];
          if(z) fireCherry(p,p.row,180,1);
          p.t=p.powered>0?0.5:2.2;
        }
        break;
      case 'doublesupercherry': // 双发超级樱桃：两发大范围樱桃弹
        if(p.t<=0){
          const z=zombies.filter(z=>!z.dead&&z.row===p.row&&z.x>p.cx()-10).sort((a,b)=>a.x-b.x)[0];
          if(z) fireCherry(p,p.row,360,2);
          p.t=p.powered>0?0.5:2.2;
        }
        break;
      case 'charmpea': // 魅惑菇豌豆：发射魅惑弹
        if(p.t<=0){ fireCharm(p,p.row); p.t=1.5; }
        break;
      case 'charmdouble': // 魅惑双发：两发魅惑弹
        if(p.t<=0){ fireCharm(p,p.row); fireCharm(p,p.row); p.t=1.6; }
        break;
      case 'cherrymachinegun': // 樱桃机枪：连发樱桃弹 + 30秒大招千发
        p.ultiT=(p.ultiT||0)-dt;
        if(p.ultiT<=0&&!p.ulti){ p.ulti=1000; p.ultiT=30; effects.push({type:'powerup',x:p.cx(),y:p.cy(),t:1.2}); }
        if(p.ulti>0){
          fireCherry(p,p.row,150,1); p.ulti--;
          p.t=0.012;
          if(p.ulti===0) p.burst=0;
        } else if(p.t<=0){
          fireCherry(p,p.row,150,1); p.burst=(p.burst||0)+1;
          p.t=p.burst>=10?(p.burst=0,0.8):0.18;
        }
        break;
      case 'jalapeno': // 火爆辣椒：烧毁整行僵尸
        if(p.t<=0){
          for(const z of zombies) if(!z.dead&&z.row===p.row) damageZombie(z,1e9);
          effects.push({type:'boom',x:cx(p.row,4),y:cy(p.row,0)-50+50,t:0.7});
          p.dead=true; sndExplode();
        }
        break;
      case 'iceshroom': // 寒冰菇：冰冻全场僵尸
        if(p.t<=0){
          for(const z of zombies){
            if(z.dead) continue;
            z.slow=8; damageZombie(z,p.powered>0?400:40);
          }
          effects.push({type:'iceburst',x:p.cx(),y:p.cy(),t:0.8});
          p.dead=true; sndChomp();
        }
        break;
      case 'doomshroom': // 毁灭菇：全屏大爆炸 + 弹坑
        if(p.t<=0){
          for(const z of zombies) damageZombie(z,1e9);
          craters.push({row:p.row,col:p.col,until:time+12});
          effects.push({type:'boom',x:p.cx(),y:p.cy(),t:0.9});
          p.dead=true; sndExplode();
        }
        break;
      case 'doommachinegun': // 毁灭机枪
      case 'firemachinegun': // 火焰机枪
      case 'icemachinegun': // 寒冰机枪
      case 'charmmachinegun': // 魅惑机枪
        p.ultiT=(p.ultiT||0)-dt;
        if(p.ultiT<=0&&!p.ulti){ p.ulti=1000; p.ultiT=30; effects.push({type:'powerup',x:p.cx(),y:p.cy(),t:1.2}); }
        if(p.ulti>0){
          fireFusionGun(p); p.ulti--;
          p.t=0.012;
          if(p.ulti===0) p.burst=0;
        } else if(p.t<=0){
          fireFusionGun(p); p.burst=(p.burst||0)+1;
          p.t=p.burst>=10?(p.burst=0,0.8):0.18;
        }
        break;
      case 'obsidianjalapeno': // 黑曜石辣椒：发射黑曜石炮弹
        if(p.t<=0){
          const z=zombies.filter(z=>!z.dead&&z.row===p.row&&z.x>p.cx()-10).sort((a,b)=>a.x-b.x)[0];
          if(z) projectiles.push({kind:'doom',row:p.row,x:p.cx()+20,y:cy(p.row,0)-50+50,vx:330,dmg:1e9,radius:1,dead:false});
          p.t=p.powered>0?0.4:2;
        }
        break;
      case 'ultcannon': // 究极炮台：连发黑曜石炮弹 + 大招千发
        p.ultiT=(p.ultiT||0)-dt;
        if(p.ultiT<=0&&!p.ulti){ p.ulti=1000; p.ultiT=30; effects.push({type:'powerup',x:p.cx(),y:p.cy(),t:1.2}); }
        if(p.ulti>0){
          projectiles.push({kind:'doom',row:p.row,x:p.cx()+20,y:cy(p.row,0)-50+50,vx:330,dmg:1e8,radius:1,dead:false});
          p.ulti--; p.t=0.012;
          if(p.ulti===0) p.burst=0;
        } else if(p.t<=0){
          projectiles.push({kind:'doom',row:p.row,x:p.cx()+20,y:cy(p.row,0)-50+50,vx:330,dmg:1e8,radius:1,dead:false});
          p.burst=(p.burst||0)+1;
          p.t=p.burst>=10?(p.burst=0,0.8):0.18;
        }
        break;
      case 'peacannon': // 豌豆炮台：三行连发豌豆 + 大招千发
        p.ultiT=(p.ultiT||0)-dt;
        if(p.ultiT<=0&&!p.ulti){ p.ulti=1000; p.ultiT=30; effects.push({type:'powerup',x:p.cx(),y:p.cy(),t:1.2}); }
        if(p.ulti>0){
          for(let r=Math.max(0,p.row-1);r<=Math.min(ROWS-1,p.row+1);r++) firePea(p,r,(r-p.row)*10);
          p.ulti--; p.t=0.012;
          if(p.ulti===0) p.burst=0;
        } else if(p.t<=0){
          for(let r=Math.max(0,p.row-1);r<=Math.min(ROWS-1,p.row+1);r++) firePea(p,r,(r-p.row)*10);
          p.burst=(p.burst||0)+1;
          p.t=p.burst>=10?(p.burst=0,0.8):0.18;
        }
        break;
    }
  }
  plants=plants.filter(p=>!p.dead);
}
function firePea(p,row,dx=0,kind='pea',dmg=20){
  projectiles.push({kind,row,x:p.cx()+28+dx,y:cy(row,0)-50+50,vx:300,dmg,dead:false});
  sndShoot();
}
function fireSpike(p,row){
  // 仙人掌尖刺：飞行快，命中僵尸不消失，可无限穿透整行
  projectiles.push({kind:'spike',row,x:p.cx()+28,y:cy(row,0)-50+50,vx:600,dmg:20,hit:[],dead:false});
  sndShoot();
}
function lobMelon(p,z){
  const startX=p.cx()+20, tx=Math.max(BL+20, z.x+15);
  projectiles.push({kind:'melon',row:p.row,x:startX,y:p.cy(),x0:startX,y0:p.cy(),tx,tx0:tx,dur:0.9,t:0,dead:false});
  sndLob();
}
function splashMelon(m){
  const col=colAt(m.tx), row=m.row;
  for(const z of zombies) if(!z.dead&&Math.abs(z.row-row)<=1&&Math.abs(colAt(z.x)-col)<=1) damageZombie(z,60);
  effects.push({type:'splash',x:m.tx,y:cy(m.row,0)-50+50,t:0.4});
}
function explodeAt(row,col,dmg){
  for(const z of zombies) if(!z.dead&&Math.abs(z.row-row)<=1&&Math.abs(colAt(z.x)-col)<=1) damageZombie(z,dmg);
}
function explodeRadius(row,col,dmg,radius=1){
  for(const z of zombies){
    if(!z.dead&&Math.abs(z.row-row)<=radius&&Math.abs(colAt(z.x)-col)<=radius) damageZombie(z,dmg);
  }
}
function fireCherry(p,row,dmg=180,radius=1){
  projectiles.push({kind:'cherry',row,x:p.cx()+20,y:cy(row,0)-50+50,vx:320,dmg,radius,dead:false});
  sndLob();
}
function fireCharm(p,row){
  projectiles.push({kind:'charm',row,x:p.cx()+28,y:cy(row,0)-50+50,vx:300,dmg:20,dead:false});
  sndShoot();
}
function fireFusionGun(p){
  if(p.type==='doommachinegun') projectiles.push({kind:'doom',row:p.row,x:p.cx()+20,y:cy(p.row,0)-50+50,vx:320,dmg:300,radius:1,dead:false});
  else if(p.type==='firemachinegun') firePea(p,p.row,0,'fire',60);
  else if(p.type==='icemachinegun') firePea(p,p.row,0,'snow',30);
  else fireCharm(p,p.row);
}
function updateProjectiles(dt){
  for(const p of projectiles){
    if(p.kind==='melon'){
      p.t+=dt; const k=clamp(p.t/p.dur,0,1);
      p.x=p.x0+(p.tx-p.x0)*k;
      p.y=p.y0-95*Math.sin(Math.PI*k);
      if(k>=1){ splashMelon(p); p.dead=true; }
      continue;
    }
    if(p.kind==='spike'){ // 仙人掌尖刺：命中后不消失，穿透整行僵尸（每只只受一次伤害）
      p.x+=p.vx*dt;
      for(const z of zombies){
        if(z.dead||z.row!==p.row||p.hit.includes(z)) continue;
        if(p.x>=z.x-8&&p.x<=z.x+42){
          p.hit.push(z);
          damageZombie(z,p.dmg);
          effects.push({type:'splat',x:p.x,y:p.y,t:0.18});
        }
      }
      if(p.x>W+30) p.dead=true;
      continue;
    }
    if(p.kind==='cherry'||p.kind==='charm'){
      p.x+=p.vx*dt;
      let hit=null;
      for(const z of zombies){
        if(z.dead||z.row!==p.row) continue;
        if(p.x>=z.x-8&&p.x<=z.x+42){ if(!hit||z.x<hit.x) hit=z; }
      }
      if(hit){
        if(p.kind==='cherry'){
          explodeRadius(p.row,colAt(hit.x),p.dmg,p.radius||1);
          effects.push({type:'boom',x:hit.x,y:cy(hit.row,0)-50+50,t:0.4});
        } else {
          if(!hit.charmed){
            hit.charmed=true; hit.dmg=Math.max(hit.dmg,30);
            effects.push({type:'powerup',x:hit.x,y:cy(hit.row,0)-50+50,t:1});
            sndChomp();
          }
        }
        p.dead=true;
      } else if(p.x>W+30) p.dead=true;
      continue;
    }
    if(p.kind==='doom'){
      p.x+=p.vx*dt;
      let hit=null;
      for(const z of zombies){
        if(z.dead||z.row!==p.row) continue;
        if(p.x>=z.x-8&&p.x<=z.x+42){ if(!hit||z.x<hit.x) hit=z; }
      }
      if(hit){
        explodeRadius(p.row,colAt(hit.x),p.dmg,p.radius||1);
        effects.push({type:'boom',x:hit.x,y:cy(hit.row,0)-50+50,t:0.4});
        p.dead=true;
      } else if(p.x>W+30) p.dead=true;
      continue;
    }
    p.x+=p.vx*dt;
    if(p.kind==='pea'||p.kind==='fire'||p.kind==='obsidian'){
      const c=colAt(p.x);
      if(c>=0&&c<COLS){
        const tp=plantAt(p.row,c);
        if(tp&&!tp.dead&&(tp.type==='torchwood'||tp.type==='obsidian')){
          if(tp.type==='obsidian'&&p.kind!=='obsidian'){
            p.kind='obsidian'; p.base=20*1000000; p.power=0; p.dmg=p.base;
          } else {
            if(p.base===undefined) p.base=20;
            p.kind=p.kind==='obsidian'?'obsidian':'fire';
            p.power=(p.power||0)+1;
            p.dmg=p.base*Math.pow(2,p.power);
          }
        }
      }
    }
    let hit=null;
    for(const z of zombies){
      if(z.dead||z.row!==p.row) continue;
      if(p.x>=z.x-8&&p.x<=z.x+42){ if(!hit||z.x<hit.x) hit=z; }
    }
    if(hit){ damageZombie(hit,p.dmg); if(p.kind==='snow') hit.slow=6; p.dead=true; effects.push({type:'splat',x:p.x,y:p.y,t:0.18}); }
    else if(p.x>W+30) p.dead=true;
  }
  projectiles=projectiles.filter(p=>!p.dead);
}
function updateZombies(dt){
  for(const z of zombies){
    if(z.dead) continue;
    z.wob+=dt*4;
    if(z.slow>0) z.slow-=dt;
    const sp=z.speed*(z.slow>0?0.35:1);
    // 魅惑僵尸：反方向撤退（向右走回出场方向），遇到同伴会停下啃食
    if(z.charmed){
      let prey=null;
      for(const o of zombies){
        if(o===z||o.dead||o.charmed) continue;
        if(o.row===z.row&&o.x>=z.x&&o.x-z.x<55){ if(!prey||o.x<prey.x) prey=o; }
      }
      if(prey){
        z.biteT-=dt;
        if(z.biteT<=0){
          damageZombie(prey,Math.max(40,z.dmg)); z.biteT=z.biteCd;
          effects.push({type:'chomp',x:prey.x,y:cy(prey.row,0)-50+50,t:0.25});
        }
      } else {
        z.x+=sp*dt;
      }
      if(z.x>W+60) z.dead=true; // 撤退离开战场（右侧出场）
      continue;
    }
    // 找前方要啃的植物（地刺不挡路）
    let target=null;
    for(const p of plants){
      if(p.dead||p.row!==z.row||p.type==='spikeweed') continue;
      const pcx=p.cx();
      if(pcx<=z.x+55&&pcx>=z.x-40){ if(!target||pcx>target.cx()) target=p; }
    }
    if(target){
      z.biteT-=dt;
      if(z.biteT<=0){
        target.hp-=z.dmg; z.biteT=z.biteCd; sndChomp();
        effects.push({type:'chomp',x:target.cx(),y:target.cy(),t:0.25});
        if(target.hp<=0) target.dead=true;
      }
    } else {
      z.x-=sp*dt;
    }
    // 玩家自放的僵尸：不触发小车和失败，走进房子处自动离场
    if(z.player){
      if(z.x<BL-90) z.dead=true;
      continue;
    }
    // 小车触发 / 失败
    if(z.x<BL-45){
      const m=mowers[z.row];
      if(m&&!m.active&&!m.gone){ m.active=true; sndMower(); }
      if(z.x<BL-80&&(!m||m.gone)){ loseGame(); return; }
    }
  }
  zombies=zombies.filter(z=>!z.dead);
}
function updateMowers(dt){
  for(const m of mowers){
    if(!m.active||m.gone) continue;
    m.x+=260*dt;
    if(m.x>W+50) m.gone=true;
    for(const z of zombies){
      if(z.dead||z.row!==m.row) continue;
      if(z.x>=m.x-35&&z.x<=m.x+60){ killZombie(z); effects.push({type:'poof',x:z.x+22,y:cy(z.row,0)-50+50,t:0.3}); }
    }
  }
}
function updateEffects(dt){ effects=effects.filter(e=>{e.t-=dt; return e.t>0;}); }

// ==================== 渲染 ====================
function draw(){
  // 天空
  ctx.fillStyle='#aee3f5'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.35)';
  [[120,42],[480,26],[840,50]].forEach(c=>{ ctx.beginPath(); ctx.arc(c[0],c[1],26,0,7); ctx.fill(); });
  // 草地棋盘
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    ctx.fillStyle=(r+c)%2===0?'#8fd06a':'#82c45f';
    ctx.fillRect(BL+c*CELL,BT+r*CELL,CELL,CELL);
  }
  ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.lineWidth=2;
  for(let c=0;c<=COLS;c++){ ctx.beginPath(); ctx.moveTo(BL+c*CELL,BT); ctx.lineTo(BL+c*CELL,BT+ROWS*CELL); ctx.stroke(); }
  for(let r=0;r<=ROWS;r++){ ctx.beginPath(); ctx.moveTo(BL,BT+r*CELL); ctx.lineTo(BL+COLS*CELL,BT+r*CELL); ctx.stroke(); }
  // 左侧房子
  ctx.fillStyle='#8a5a3b'; ctx.fillRect(10,BT-10,BL-20,ROWS*CELL+20);
  ctx.fillStyle='#c98f5f'; ctx.fillRect(10,BT-10,BL-20,34);
  ctx.fillStyle='#f4e2c1';
  for(let r=0;r<ROWS;r++) ctx.fillRect(16,BT+r*CELL+12,26,CELL-24);
  ctx.fillStyle='#fff'; ctx.fillRect(30,BT+4*CELL+2,8,14); // 门
  // 小车
  for(const m of mowers) drawMower(m);
  // 植物
  for(const p of plants) drawPlant(p);
  // 僵尸
  for(const z of zombies) drawZombie(z);
  // 子弹
  for(const p of projectiles) drawProjectile(p);
  // 阳光
  for(const s of suns) drawSun(s);
  // 能量豆 & 金克拉
  for(const pf of plantFoodDrops) drawPlantFood(pf);
  for(const gd of goldDrops) drawGold(gd);
  if(dragItem) drawDragItem();
  if(gloveDrag) drawGloveDrag();
  // 毁灭菇弹坑（焦土）
  for(const cr of craters){
    const remain=cr.until-time;
    if(remain<=0) continue;
    ctx.fillStyle='rgba(30,20,10,0.55)';
    ctx.fillRect(BL+cr.col*CELL+4,BT+cr.row*CELL+4,CELL-8,CELL-8);
    ctx.strokeStyle='rgba(120,90,50,0.8)'; ctx.lineWidth=2; ctx.strokeRect(BL+cr.col*CELL+4,BT+cr.row*CELL+4,CELL-8,CELL-8);
    ctx.font='15px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,220,150,0.75)'; ctx.fillText('⏳'+Math.ceil(remain)+'s', BL+cr.col*CELL+CELL/2, BT+cr.row*CELL+CELL/2);
  }
  // 特效
  for(const e of effects) drawEffect(e);
  // 戴夫 NPC（站在房子前，最上层）
  drawDave();
  // 放置幽灵
  drawGhost();
  // 横幅
  if(banner){
    const a=clamp(banner.t/0.5,0,1);
    ctx.globalAlpha=a;
    ctx.font='bold 46px "Comic Sans MS","Microsoft YaHei"'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#7b0d0d';
    ctx.fillText('一大波僵尸来袭！', W/2, H/2-20);
    ctx.strokeStyle='#fff'; ctx.lineWidth=6; ctx.strokeText('一大波僵尸来袭！', W/2, H/2-20);
    ctx.globalAlpha=1;
  }
}
function drawPlant(p){
  const x=p.cx(), y=p.cy(), t=time;
  const sway=Math.sin(t*2+p.row+p.col)*0.06;
  ctx.save(); ctx.translate(x,y); ctx.rotate(sway);
  if(p.powered>0){
    ctx.strokeStyle='rgba(76,175,80,'+(0.4+Math.sin(t*10)*0.25)+')';

function drawEffect(e){
  const k=clamp(e.t,0,1);
  if(e.type==='boom'){
    const r=(1-k)*95+8;
    ctx.fillStyle='rgba(255,150,40,'+k*0.85+')'; ctx.beginPath(); ctx.arc(e.x,e.y,r,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,240,180,'+k*0.8+')'; ctx.beginPath(); ctx.arc(e.x,e.y,r*0.55,0,7); ctx.fill();
  } else if(e.type==='splat'){
    ctx.fillStyle='rgba(90,180,80,'+k+')'; ctx.beginPath(); ctx.arc(e.x,e.y,8,0,7); ctx.fill();
  } else if(e.type==='splash'){
    ctx.fillStyle='rgba(80,190,90,'+k*0.8+')'; ctx.beginPath(); ctx.arc(e.x,e.y,22*k+8,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,100,100,'+k+')';
    for(let i=0;i<4;i++){ const a=i*1.57; ctx.beginPath(); ctx.arc(e.x+Math.cos(a)*26*Math.sin(k*3.14), e.y+Math.sin(a)*26*Math.sin(k*3.14), 3,0,7); ctx.fill(); }
  } else if(e.type==='poof'){
    ctx.strokeStyle='rgba(255,255,255,'+k*0.7+')'; ctx.lineWidth=3;
    for(let i=0;i<5;i++){ const a=i*1.26; ctx.beginPath(); ctx.moveTo(e.x,e.y); ctx.lineTo(e.x+Math.cos(a)*26*(1-k), e.y+Math.sin(a)*26*(1-k)); ctx.stroke(); }
  } else if(e.type==='chomp'){
    ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,'+k+')'; ctx.fillText('💢',e.x,e.y);
  } else if(e.type==='powerup'){
    ctx.save(); ctx.translate(e.x,e.y);
    const r=(1-k)*55;
    ctx.strokeStyle=`rgba(76,175,80,${k})`;
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
    ctx.fillStyle=`rgba(129,199,132,${k*0.3})`;
    ctx.beginPath(); ctx.arc(0,0,r*0.7,0,7); ctx.fill();
    ctx.restore();
  } else if(e.type==='heal'){
    ctx.save(); ctx.translate(e.x,e.y);
    ctx.strokeStyle=`rgba(255,215,64,${k})`;
    ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,(1-k)*42+6,0,7); ctx.stroke();
    ctx.fillStyle=`rgba(140,230,150,${k*0.35})`;
    ctx.beginPath(); ctx.arc(0,0,(1-k)*30+4,0,7); ctx.fill();
    ctx.restore();
  } else if(e.type==='iceburst'){
    ctx.save(); ctx.translate(e.x,e.y);
    const r=(1-k)*140+10;
    ctx.fillStyle='rgba(160,220,255,'+k*0.5+')'; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,'+k+')'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,r*0.7,0,7); ctx.stroke();
    ctx.restore();
  }
}

function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type,v,when){ const a=ac(); if(!a)return; const o=a.createOscillator(),g=a.createGain();
  o.type=type||'square'; o.frequency.value=f; g.gain.value=v||0.07;
  o.connect(g); g.connect(a.destination); const t=a.currentTime+(when||0);
  o.start(t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.stop(t+d+0.02); }

// ==================== 输入 ====================
function getPos(e){
  const rect=cv.getBoundingClientRect();
  const t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;
  return {x:(t.clientX-rect.left)*W/rect.width, y:(t.clientY-rect.top)*H/rect.height};
}
// 合成判定：该格放置 type 会合成什么（无则 null）
function recipeOfCell(type,row,col){
  const base=plantAt(row,col);
  if(!base) return null;
  let rec=FUSION[base.type]&&FUSION[base.type][type];
  // 堡垒坚果特殊合成：[坚果][高坚果][坚果] 排列 + 魔术洋芋/土豆雷 → 堡垒坚果
  if((type==='magictater'||type==='potatomine')&&base.type==='tallnut'){
    const l=plantAt(row,col-1), r=plantAt(row,col+1);
    if(l&&r&&l.type==='wallnut'&&r.type==='wallnut') rec='fortnut';
  }
  return rec||null;
}
// 通用放置/合成（free=true 表示不扣阳光，用于手套移动）
function placePlant(type,row,col,free){
  const P=PLANTS[type];
  const base=plantAt(row,col);
  const recipe=recipeOfCell(type,row,col);
  if(recipe){
    if(!free&&(sun<P.cost||pcd[type]>0)) return false;
    if(!free) sun-=P.cost;
    const bx=base.cx(), by=base.cy();
    if(recipe==='fortnut'){
      // 堡垒坚果吞噬两侧坚果墙合三为一
      const l=plantAt(row,col-1), r=plantAt(row,col+1);
      if(l) removePlant(l); if(r) removePlant(r);
    }
    removePlant(base);
    addPlant(recipe,row,col);
    pcd[type]=0; // 植物无冷却
    sndFusion();
    effects.push({type:'powerup',x:bx,y:by,t:1});
    daveSay('✨ 合成 '+PLANTS[recipe].name+'！');
    updateHUD();
    return true;
  }
  // 毁灭菇弹坑内不能种植
  if(craters.some(c=>c.row===row&&c.col===col&&time<c.until)) return false;
  if(!free&&type!=='hypnotoad'&&zombies.some(z=>!z.dead&&z.row===row&&z.x<cx(row,col))) return false;
  if(!free&&(sun<P.cost||pcd[type]>0)) return false;
  if(!free) sun-=P.cost;
  addPlant(type,row,col);
  pcd[type]=0; // 植物无冷却
  sndPlant(); updateHUD();
  return true;
}
// 手套放置可行性（不消耗阳光）
function canPlaceFree(type,row,col){
  if(recipeOfCell(type,row,col)) return true;
  if(plantAt(row,col)) return false;
  if(craters.some(c=>c.row===row&&c.col===col&&time<c.until)) return false;
  return true;
}
function onDown(e){
  e.preventDefault();
  if(screen!=='play'||paused) return;
  const pos=getPos(e);
  // 捡起能量豆 / 金克拉（拖拽使用）
  for(let i=plantFoodDrops.length-1;i>=0;i--){
    const pf=plantFoodDrops[i];
    if(Math.hypot(pos.x-pf.x,pos.y-pf.y)<34){
      plantFoodDrops.splice(i,1);
      dragItem={kind:'plantfood',item:pf};
      pf.x=pos.x; pf.y=pos.y;
      return;
    }
  }
  for(let i=goldDrops.length-1;i>=0;i--){
    const gd=goldDrops[i];
    if(Math.hypot(pos.x-gd.x,pos.y-gd.y)<34){
      goldDrops.splice(i,1);
      dragItem={kind:'gold',item:gd};
      gd.x=pos.x; gd.y=pos.y;
      return;
    }
  }
  // 收阳光
  for(const s of suns){
    if(Math.hypot(pos.x-s.x,pos.y-s.y)<36){ s.t=0; sun+=s.val; sndSun(); updateHUD(); return; }
  }
  const cell=cellFromXY(pos.x,pos.y);
  if(!cell) return;
  if(selected&&selected.kind==='shovel'){
    const p=plantAt(cell.row,cell.col);
    if(p){ removePlant(p); sndShovel(); }
    selected=null; updateHUD(); return;
  }
  if(selected&&selected.kind==='glove'){
    if(!gloveDrag){
      const p=plantAt(cell.row,cell.col);
      if(p){ gloveDrag={type:p.type,fromRow:p.row,fromCol:p.col}; removePlant(p); sndShovel(); }
    } else {
      const g=gloveDrag;
      if(!placePlant(g.type,cell.row,cell.col,true)) placePlant(g.type,g.fromRow,g.fromCol,true); // 放不上去就放回原位
      gloveDrag=null;
    }
    selected=null; updateHUD(); return;
  }
  if(selected&&selected.kind==='card'){
    const type=selected.type;
    placePlant(type,cell.row,cell.col,false);
    selected=null; updateHUD();
  }
  if(selected&&selected.kind==='zombie'){
    // 放僵尸：场上玩家僵尸最多 20 只，点一次放一只（保留选择可连放）
    let cnt=0;
    for(const z of zombies) if(z.player&&!z.dead) cnt++;
    if(cnt>=20){ daveSay('自放僵尸已满 20 只，先消灭一些再放吧！'); return; }
    placePlayerZombie(selected.type,cell.row,cell.col);
    sndWave();
  }
}
function onUp(e){
  if(screen!=='play'||paused||!dragItem) return;
  const pos=getPos(e);
  const cell=cellFromXY(pos.x,pos.y);
  const p=cell?plantAt(cell.row,cell.col):null;
  if(dragItem.kind==='plantfood'){
    if(p&&ATTACK_PLANTS.includes(p.type)){
      p.powered=10;
      effects.push({type:'powerup',x:p.cx(),y:p.cy(),t:1});
      sndSun();
    } else {
      daveSay('能量豆只能用于攻击性植物！');
      const it=dragItem.item; it.x=clamp(pos.x,BL+30,BL+COLS*CELL-30); it.y=clamp(pos.y,BT+30,BT+ROWS*CELL-30);
      plantFoodDrops.push(it);
    }
  } else if(dragItem.kind==='gold'){
    if(p){
      p.hp=p.maxHp;
      effects.push({type:'heal',x:p.cx(),y:p.cy(),t:0.8});
      sndSun();
    } else {
      const it=dragItem.item; it.x=clamp(pos.x,BL+30,BL+COLS*CELL-30); it.y=clamp(pos.y,BT+30,BT+ROWS*CELL-30);
      goldDrops.push(it);
    }
  }
  dragItem=null;
}
function cancelDrag(){
  if(dragItem){
    if(dragItem.kind==='plantfood') plantFoodDrops.push(dragItem.item);
    else goldDrops.push(dragItem.item);
    dragItem=null;
  }
  if(gloveDrag){ // 手套：把拾起的植物放回原位
    placePlant(gloveDrag.type,gloveDrag.fromRow,gloveDrag.fromCol,true);
    gloveDrag=null;
  }
}
cv.addEventListener('mousedown',onDown);
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouse={x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
  if(dragItem){ dragItem.item.x=mouse.x; dragItem.item.y=mouse.y; }
});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length){ e.preventDefault(); const r=cv.getBoundingClientRect(); const t=e.touches[0];
    mouse={x:(t.clientX-r.left)*W/r.width, y:(t.clientY-r.top)*H/r.height};
    if(dragItem){ dragItem.item.x=mouse.x; dragItem.item.y=mouse.y; } }
},{passive:false});
cv.addEventListener('mouseup',onUp);
cv.addEventListener('touchend',onUp);
cv.addEventListener('contextmenu',e=>{ e.preventDefault(); cancelDrag(); selected=null; updateHUD(); });
document.addEventListener('keydown',e=>{
  const keys=['1','2','3','4','5','6','7','8','9','0','-','=','q','w','e','r','t','y'];
  const i=keys.indexOf(e.key);
  if(i>=0&&i<SLOT_PLANTS.length&&screen==='play'){ ac(); cancelDrag(); selected={kind:'card',type:SLOT_PLANTS[i]}; updateHUD(); }
  if(e.key==='Escape'){ cancelDrag(); selected=null; updateHUD(); }
  if(e.key==='p'||e.key==='P'){ if(screen==='play'){ paused=!paused; document.getElementById('pauseBtn').textContent=paused?'▶':'⏸'; } }
});

// ==================== 主循环 ====================
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(screen==='play') update(dt);
  draw();
  requestAnimationFrame(loop);
}
buildMenu();
buildCards();
buildZombieCards();
requestAnimationFrame(loop);
</script>
</body>
</html>
